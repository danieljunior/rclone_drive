services:
  config:
    image: rclone/rclone:latest
    stdin_open: true
    tty: true
    ports:
      - "53682:53682"
    volumes:
      - ./config:/config/rclone
    command:
      - "config"
    profiles:
      - manual

  upload:
    image: rclone/rclone:latest
    volumes:
      - ./config:/config/rclone
      - ${LOCAL_PATH:-./data}:/data:ro
    command:
      - "copy"
      - "/data"
      - "${RCLONE_REMOTE_NAME:-gdrive}:${REMOTE_PATH-backup}"
      - "--progress"
      - "--fast-list"
      - "--drive-chunk-size=32M"
    profiles:
      - manual
